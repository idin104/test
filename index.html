<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>خزانه بازی | Game Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main class="shell">
    <header class="site-header">
      <a class="brand" href="#gameGrid" aria-label="Game Vault">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span>
          <span id="brandText">خزانه بازی</span>
          <small>Curated games</small>
        </span>
      </a>

      <button
        class="language"
        id="languageButton"
        type="button"
        aria-label="Switch language"
      >EN</button>
    </header>

    <section class="intro">
      <div>
        <div class="eyebrow" id="eyebrow">انتخاب‌های ماندگار</div>
        <h1 id="pageTitle">بازی‌هایی که جهان ساختند.</h1>
      </div>

      <p class="intro-copy" id="introCopy">
        مجموعه‌ای دست‌چین‌شده از دنیاهای فراموش‌نشدنی؛ از روایت‌های انسانی تا
        قلمروهایی که آجر به آجر ساخته می‌شوند.
      </p>
    </section>

    <section class="collection" aria-labelledby="collectionTitle">
      <div class="collection-head">
        <h2 id="collectionTitle">مجموعه منتخب</h2>
        <span class="counter" id="gameCounter">24 — 2026</span>
      </div>

      <div class="grid" id="gameGrid" aria-label="Game collection"></div>
    </section>
  </main>

  <aside
    class="vault-modal"
    id="gameModal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="detailTitle"
  >
    <div class="modal-backdrop" aria-hidden="true"></div>

    <div class="modal-top">
      <span class="modal-label" id="modalLabel">پرونده بازی</span>

      <div class="modal-actions">
        <button
          class="modal-language"
          id="modalLanguageButton"
          type="button"
          aria-label="Switch language"
        >EN</button>

        <button class="close" id="closeModal" type="button" aria-label="بستن">
          ✕
        </button>
      </div>
    </div>

    <figure class="hero-frame" id="heroFrame">
      <img id="heroImage" alt="">
      <figcaption class="hero-caption" id="heroCaption">
        <span class="genre" id="heroGenre"></span>
        <h2 id="heroTitle"></h2>
      </figcaption>
    </figure>

    <div class="reveal-cue" id="revealCue" aria-hidden="true">
      <svg width="18" height="24" viewBox="0 0 18 24" fill="none">
        <path
          d="M9 22V2M9 2L2 9M9 2l7 7"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
      <span id="cueText">برای نمایش جزئیات، رو به بالا اسکرول کنید</span>
    </div>

    <div class="details-scroller" id="detailsScroller">
      <section class="details">
        <div class="details-inner">
          <dl class="facts" id="facts"></dl>

          <div class="detail-copy">
            <span class="index" id="detailIndex"></span>
            <h2 id="detailTitle"></h2>
            <p class="description" id="description"></p>

            <h3 class="feature-title" id="featureTitle">ویژگی‌های کلیدی</h3>
            <ul class="features" id="features"></ul>

            <button class="back-to-grid" id="backButton" type="button">
              بازگشت به مجموعه
            </button>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <script src="js/games.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
